services:
  - type: web
    name: jpc-portal-api
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: "JPC Portal API"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://jpc-portal-api.onrender.com
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SEED_DEVELOPMENT_DATA
        value: "true"
      - key: SEED_ACADEMIC_YEAR_START
        value: "2026-06-01"
      - key: SEED_ACADEMIC_YEAR_END
        value: "2027-05-31"
      - key: SEED_ADMIN_PASSWORD
        value: P@ssw0rd2026
      - key: SEED_HR_PASSWORD
        value: P@ssw0rd2026
      - key: SEED_DEPARTMENT_HEAD_PASSWORD
        value: P@ssw0rd2026
      - key: SEED_EMPLOYEE_PASSWORD
        value: P@ssw0rd2026
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_ENDPOINT
        value: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_SAME_SITE
        value: none
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_PARTITIONED_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: database
